<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1B1228"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="saffronGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas with Ornate Border -->
  <rect x="10" y="10" width="900" height="160" rx="16" fill="url(#headerBg)" stroke="#B45309" stroke-width="2"/>
  <rect x="16" y="16" width="888" height="148" rx="12" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Corner Ornamental Mandalas -->
  <!-- Top-Left Corner -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="10" stroke="#F59E0B" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#D97706"/>
    <path d="M 0 -12 L 0 -18 M 0 12 L 0 18 M -12 0 L -18 0 M 12 0 L 18 0" stroke="#F59E0B" stroke-width="1.2"/>
  </g>
  <!-- Top-Right Corner -->
  <g transform="translate(888, 32)">
    <circle cx="0" cy="0" r="10" stroke="#F59E0B" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#D97706"/>
    <path d="M 0 -12 L 0 -18 M 0 12 L 0 18 M -12 0 L -18 0 M 12 0 L 18 0" stroke="#F59E0B" stroke-width="1.2"/>
  </g>
  <!-- Bottom-Left Corner -->
  <g transform="translate(32, 148)">
    <circle cx="0" cy="0" r="10" stroke="#F59E0B" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#D97706"/>
    <path d="M 0 -12 L 0 -18 M 0 12 L 0 18 M -12 0 L -18 0 M 12 0 L 18 0" stroke="#F59E0B" stroke-width="1.2"/>
  </g>
  <!-- Bottom-Right Corner -->
  <g transform="translate(888, 148)">
    <circle cx="0" cy="0" r="10" stroke="#F59E0B" stroke-width="1" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#D97706"/>
    <path d="M 0 -12 L 0 -18 M 0 12 L 0 18 M -12 0 L -18 0 M 12 0 L 18 0" stroke="#F59E0B" stroke-width="1.2"/>
  </g>

  <!-- Central Crown Diya / Kalash Motif -->
  <g transform="translate(460, 36)">
    <!-- Diya Base -->
    <path d="M -16 6 C -12 12, 12 12, 16 6 C 12 8, -12 8, -16 6 Z" fill="#D97706"/>
    <!-- Diya Flame -->
    <path d="M 0 -10 C -4 -4, -3 2, 0 4 C 3 2, 4 -4, 0 -10 Z" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="2" fill="#FEF3C7"/>
    <!-- Side Decorative Flourishes -->
    <path d="M -18 8 C -26 6, -32 -2, -38 0 C -34 4, -28 9, -20 10" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
    <path d="M 18 8 C 26 6, 32 -2, 38 0 C 34 4, 28 9, 20 10" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Subtitle / Greeting (Devanagari Namaste) -->
  <text x="460" y="66" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="16" font-weight="700" fill="#F59E0B" letter-spacing="4">
    ॥ नमस्ते • WELCOME ॥
  </text>

  <!-- Main Name Title (Regal Gold) -->
  <text x="460" y="106" text-anchor="middle" font-family="'Cinzel', 'Georgia', 'Playfair Display', serif" font-size="34" font-weight="800" fill="url(#goldGradient)" letter-spacing="3">
    SACHIN KUMAR SINGH
  </text>

  <!-- Tagline / Domain Expertise -->
  <text x="460" y="136" text-anchor="middle" font-family="'Segoe UI', 'Roboto', 'Inter', sans-serif" font-size="13.5" font-weight="500" fill="#E2E8F0" letter-spacing="2">
    FULL-STACK ARCHITECT &amp; GENAI DEVELOPER • ARTISAN OF INTENTIONAL CODE
  </text>

  <!-- Bottom Arch Accent Line -->
  <path d="M 320 152 Q 460 162 600 152" stroke="#D97706" stroke-width="1.5" fill="none"/>
  <circle cx="460" cy="157" r="2.5" fill="#FBBF24"/>
</svg>
