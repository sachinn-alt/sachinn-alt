<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="45" fill="none">
  <defs>
    <linearGradient id="saffronGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0" />
      <stop offset="25%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Left Vine Line -->
  <path d="M 50 30 C 150 24, 250 36, 350 30 C 390 28, 420 31, 450 30" stroke="url(#saffronGold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left Vine Accent Dots -->
  <circle cx="120" cy="27" r="2.5" fill="#F59E0B"/>
  <circle cx="200" cy="33" r="2" fill="#D97706"/>
  <circle cx="280" cy="27" r="3" fill="#F59E0B"/>
  <circle cx="360" cy="32" r="2.5" fill="#D97706"/>
  <circle cx="420" cy="28" r="3" fill="#FBBF24"/>

  <!-- Left Lotus Petal Flourish -->
  <path d="M 445 30 C 430 20, 415 22, 425 30 C 415 38, 430 40, 445 30 Z" fill="#D97706" opacity="0.8"/>
  <path d="M 458 30 C 445 22, 435 24, 442 30 C 435 36, 445 38, 458 30 Z" fill="#F59E0B"/>

  <!-- Center Mandala & Lotus Motif -->
  <g transform="translate(500, 30)">
    <circle cx="0" cy="0" r="24" stroke="#D97706" stroke-width="1.5" stroke-dasharray="2,3"/>
    <circle cx="0" cy="0" r="18" stroke="#F59E0B" stroke-width="1"/>
    
    <path d="M 0 -22 C -4 -14, -6 -6, 0 0 C 6 -6, 4 -14, 0 -22 Z" fill="#F59E0B"/>
    <path d="M 0 22 C -4 14, -6 6, 0 0 C 6 6, 4 14, 0 22 Z" fill="#F59E0B"/>
    <path d="M -22 0 C -14 -4, -6 -6, 0 0 C -6 6, -14 4, -22 0 Z" fill="#F59E0B"/>
    <path d="M 22 0 C 14 -4, 6 -6, 0 0 C 6 6, 14 4, 22 0 Z" fill="#F59E0B"/>
    
    <path d="M -15 -15 C -13 -6, -6 -13, 0 0 C -6 -6, -13 -6, -15 -15 Z" fill="#D97706"/>
    <path d="M 15 -15 C 13 -6, 6 -13, 0 0 C 6 -6, 13 -6, 15 -15 Z" fill="#D97706"/>
    <path d="M -15 15 C -13 6, -6 13, 0 0 C -6 6, -13 6, -15 15 Z" fill="#D97706"/>
    <path d="M 15 15 C 13 6, 6 13, 0 0 C 6 6, 13 6, 15 15 Z" fill="#D97706"/>

    <circle cx="0" cy="0" r="8" fill="url(#warmAmber)"/>
    <circle cx="0" cy="0" r="4" fill="#78350F"/>
    <circle cx="0" cy="0" r="2" fill="#FEF3C7"/>
  </g>

  <!-- Right Lotus Petal Flourish -->
  <path d="M 542 30 C 555 22, 565 24, 558 30 C 565 36, 555 38, 542 30 Z" fill="#F59E0B"/>
  <path d="M 555 30 C 570 20, 585 22, 575 30 C 585 38, 570 40, 555 30 Z" fill="#D97706" opacity="0.8"/>

  <!-- Right Vine Accent Dots -->
  <circle cx="580" cy="28" r="3" fill="#FBBF24"/>
  <circle cx="640" cy="32" r="2.5" fill="#D97706"/>
  <circle cx="720" cy="27" r="3" fill="#F59E0B"/>
  <circle cx="800" cy="33" r="2" fill="#D97706"/>
  <circle cx="880" cy="27" r="2.5" fill="#F59E0B"/>

  <!-- Right Vine Line -->
  <path d="M 550 30 C 580 31, 610 28, 650 30 C 750 36, 850 24, 950 30" stroke="url(#saffronGold)" stroke-width="2" stroke-linecap="round"/>
</svg>
