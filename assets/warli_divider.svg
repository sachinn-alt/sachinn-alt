<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="100%" height="40" fill="none">
  <defs>
    <!-- Warli Figure Definition: Two triangles + head + limbs -->
    <g id="warli-dancer">
      <!-- Head -->
      <circle cx="0" cy="-14" r="3.5" fill="#F59E0B"/>
      <!-- Body (2 interlocking triangles) -->
      <polygon points="0,-10 -6,0 6,0" fill="#F59E0B"/>
      <polygon points="0,0 -6,-10 6,-10" fill="#D97706"/>
      <!-- Legs -->
      <path d="M -3 0 L -6 9 L -3 10" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M 3 0 L 6 9 L 9 10" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- Arms linked -->
      <path d="M -5 -6 L -12 -2 L -18 -8" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M 5 -6 L 12 -2 L 18 -8" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Warli Tarpa Musician -->
    <g id="warli-musician">
      <circle cx="0" cy="-14" r="3.5" fill="#FBBF24"/>
      <polygon points="0,-10 -6,0 6,0" fill="#F59E0B"/>
      <polygon points="0,0 -6,-10 6,-10" fill="#D97706"/>
      <!-- Legs seated/playing -->
      <path d="M -3 0 L -7 8 L -4 10" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M 3 0 L 7 8 L 4 10" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- Long Tarpa Trumpet Horn -->
      <path d="M 3 -12 L 20 -18" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="20,-18 26,-22 25,-14" fill="#F59E0B"/>
      <!-- Arms holding horn -->
      <path d="M 4 -6 L 10 -14" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -4 -6 L 5 -12" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Warli Peacock -->
    <g id="warli-peacock">
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#D97706"/>
      <circle cx="-10" cy="-6" r="3" fill="#F59E0B"/>
      <path d="M -13 -6 L -17 -6" stroke="#F59E0B" stroke-width="1.5"/>
      <!-- Crest -->
      <path d="M -10 -9 L -12 -13" stroke="#FBBF24" stroke-width="1"/>
      <path d="M -9 -9 L -9 -14" stroke="#FBBF24" stroke-width="1"/>
      <path d="M -8 -9 L -6 -13" stroke="#FBBF24" stroke-width="1"/>
      <!-- Legs -->
      <path d="M -2 5 L -4 12 L -6 12" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      <path d="M 3 5 L 2 12 L 4 12" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      <!-- Feathers Train -->
      <path d="M 6 -2 Q 22 -10 28 4" stroke="#F59E0B" stroke-width="2" fill="none"/>
      <path d="M 7 0 Q 20 -4 26 8" stroke="#D97706" stroke-width="1.5" fill="none"/>
      <circle cx="28" cy="4" r="2" fill="#FBBF24"/>
      <circle cx="26" cy="8" r="1.8" fill="#F59E0B"/>
    </g>
  </defs>

  <!-- Top Geometric Border -->
  <line x1="20" y1="6" x2="880" y2="6" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="20" y1="10" x2="880" y2="10" stroke="#78350F" stroke-width="0.8"/>

  <!-- Left Side: Peacocks & Dancers -->
  <use href="#warli-peacock" x="100" y="28"/>
  <use href="#warli-dancer" x="180" y="32"/>
  <use href="#warli-dancer" x="220" y="32"/>
  <use href="#warli-dancer" x="260" y="32"/>
  <use href="#warli-dancer" x="300" y="32"/>
  <use href="#warli-musician" x="350" y="32"/>

  <!-- Center Sun / Sacred Mandala Emblem -->
  <g transform="translate(450, 28)">
    <circle cx="0" cy="0" r="10" fill="#EA580C"/>
    <circle cx="0" cy="0" r="6" fill="#FBBF24"/>
    <!-- Sun Rays (triangular) -->
    <polygon points="0,-14 -2,-10 2,-10" fill="#F59E0B"/>
    <polygon points="0,14 -2,10 2,10" fill="#F59E0B"/>
    <polygon points="-14,0 -10,-2 -10,2" fill="#F59E0B"/>
    <polygon points="14,0 10,-2 10,2" fill="#F59E0B"/>
    <polygon points="-10,-10 -9,-6 -6,-9" fill="#D97706"/>
    <polygon points="10,-10 9,-6 6,-9" fill="#D97706"/>
    <polygon points="-10,10 -9,6 -6,9" fill="#D97706"/>
    <polygon points="10,10 9,6 6,9" fill="#D97706"/>
  </g>

  <!-- Right Side: Musician & Dancers & Peacocks -->
  <g transform="translate(900, 0) scale(-1, 1)">
    <use href="#warli-peacock" x="100" y="28"/>
    <use href="#warli-dancer" x="180" y="32"/>
    <use href="#warli-dancer" x="220" y="32"/>
    <use href="#warli-dancer" x="260" y="32"/>
    <use href="#warli-dancer" x="300" y="32"/>
    <use href="#warli-musician" x="350" y="32"/>
  </g>

  <!-- Bottom Geometric Border -->
  <line x1="20" y1="44" x2="880" y2="44" stroke="#78350F" stroke-width="0.8"/>
  <line x1="20" y1="48" x2="880" y2="48" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="6,4"/>
</svg>
